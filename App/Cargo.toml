[workspace]
resolver = "2"
members = [
    "crates/foundry-core",
    "crates/foundry-api",
    "crates/foundry-cli",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
foundry-core = { path = "crates/foundry-core" }
foundry-api = { path = "crates/foundry-api" }
